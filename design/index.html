<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIJ · 웹 화면 구성안</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
:root{--paper:#f7f8f2;--ink:#183d35;--muted:#62746b;--green:#245b48;--lime:#dceca4;--white:#fff;--border:#dde4d8;--space:24px;--radius:12px}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.65 'Noto Sans KR',sans-serif}header{padding:25px 5%;background:white;display:flex;justify-content:space-between;gap:20px;align-items:center}header b{font-size:19px}a{color:inherit}nav{display:flex;gap:8px;flex-wrap:wrap;padding:20px 5%;border-bottom:1px solid var(--border)}button{font:inherit;cursor:pointer;border:1px solid var(--border);border-radius:8px;background:white;padding:10px 16px;color:var(--ink)}nav button[aria-current=page]{background:var(--green);color:white}main{max-width:1200px;margin:auto;padding:40px 48px}h1{font-size:42px;line-height:1.5;margin:15px 0;white-space:pre-line}#intro{color:var(--muted);white-space:pre-line}#label{font-size:12px;font-weight:bold;letter-spacing:2px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:30px 0}article{padding:24px;background:white;border-radius:12px}h2{font-size:20px;margin:0 0 16px}article p{white-space:pre-line;color:var(--muted);margin:0}#next{background:var(--green);color:white;padding:15px 24px}.note{font-size:12px;color:var(--muted);margin-top:24px}footer{padding:20px 5%;border-top:1px solid var(--border);font-size:12px}@media(max-width:700px){header{display:block}main{padding:30px 20px}h1{font-size:30px}.cards{grid-template-columns:1fr}nav button{font-size:12px}}
</style></head><body><header><b>kij ↗ SUWON INDUSTRY JOURNEY</b><a href="https://www.figma.com/design/pYiWaFUaCPBXPZp1tytH6f/?node-id=4-19">Figma 구성안 ↗</a></header><nav aria-label="화면 선택"></nav><main><div id="label"></div><h1></h1><p id="intro"></p><div class="cards"></div><button id="next"></button><p class="note">화면 구성 검토용 · 버튼은 다음 화면으로 이동합니다. 실제 AI 추천·신청·연결 기능이 아닙니다.<br>실제 기업용 서비스는 일본어 우선입니다. 시설·일정·신청은 가상 예시입니다.</p></main><footer>KIJ / 2026.10.28 · 등록 데이터 기반 추천 → 컨벤션센터 신청 → 관광기업 연결</footer><script>
const labels=['01 홈','02 조건 선택','03 추천 일정','04 신청','05 신청 현황','06 센터 운영'];let screens=[],index=0;const q=s=>document.querySelector(s);function render(i){index=i;const s=screens[i];q('#label').textContent=s.label;q('h1').textContent=s.title;q('#intro').textContent=s.intro;q('.cards').replaceChildren();for(const [title,body]of s.cards){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=body;a.append(h,p);q('.cards').append(a);}q('#next').textContent=i===5?'처음 화면으로 돌아가기 →':s.cta;document.querySelectorAll('nav button').forEach((b,j)=>{if(i===j)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}fetch('screens.json').then(r=>{if(!r.ok)throw Error('콘텐츠 로드 실패');return r.json();}).then(data=>{screens=data;labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>render(i);q('nav').append(b);});q('#next').onclick=()=>render((index+1)%screens.length);render(0);}).catch(()=>{q('h1').textContent='구성안을 불러오지 못했습니다.';q('#intro').textContent='README의 로컬 서버 실행 방법을 확인해 주세요.';q('#next').hidden=true;});
</script></body></html>
